name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopsphere
          POSTGRES_PASSWORD: shopsphere
          POSTGRES_DB: shopsphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopsphere"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://shopsphere:shopsphere@localhost:5432/shopsphere?schema=public
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://shopsphere:shopsphere@localhost:5432/shopsphere?schema=public
          REDIS_URL: redis://localhost:6379
          CORS_ORIGINS: http://localhost:5173

  admin-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000

  customer-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
